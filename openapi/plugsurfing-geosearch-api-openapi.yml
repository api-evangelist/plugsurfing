  /drive/v1/locations/{locationId}:
    get:
      tags:
      - Geosearch
      summary: Get location by id
      operationId: getLocationById
      description: Get location details, including prices. Only one of userId or keyIdentifier can be provided in a single request. If none are provided, default prices are returned. For more information on prices, check https://developer.plugsurfing.com/docs/geosearch#explanation
      parameters:
      - name: locationId
        in: path
        description: Location id.
        example: 8rMCionje8s2LtheVGEK90mYnJdJe5OZd48ecF/w1StRJSodFFzfQ3GhJbYbxG0gQhJv/Yjp5FXBJt14SccU9zFRdnC4SV7juPdCRaWkEZo=
        required: true
        schema:
          type: string
      - name: userId
        in: query
        description: The id of a user, will be used to look up specific prices for this user
        required: false
        schema:
          type: string
      - name: keyIdentifier
        in: query
        description: The keyIdentifier of a chargingKey, will be used to look up specific prices for this chargingKey
        required: false
        schema:
          type: string
      - name: language
        schema:
          type: string
          minLength: 2
          maxLength: 2
        in: query
        required: false
        example: en
        description: 'Supported languages: en, bg, cy, de, es, fi, fr, hu, is, it, lt, nb, nl, pl, pt, ro, ru, sv.'
