  /drive/v1/geosearch/route:
    post:
      summary: Route search
      description: Search for charging locations along a route. The max number of points in a route is 300. Prices are not included. To get prices for a given location, use Get location by id
      operationId: searchLocationsByRoute
      tags:
      - Geosearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlongRouteRequest'
            examples:
              routeSearch:
                summary: Search along a route
                value:
                  points:
                  - latitude: 52.52
                    longitude: 13.405
                  - latitude: 52.37
                    longitude: 4.9
                  filters:
                    connectorStandards:
                    - Combo
              routeSearchWithPnC:
                summary: Search along a route for PnC-capable stations
                value:
                  points:
                  - latitude: 52.52
                    longitude: 13.405
                  - latitude: 52.37
                    longitude: 4.9
                  filters:
                    connectorStandards:
                    - Combo
                    capabilities:
                    - PLUG_AND_CHARGE_CAPABLE
      parameters:
      - name: width
        in: query
        description: Distance to search from the center of the route, in meters (will be split equally on both sides of the route)
        schema:
          type: number
          default: 3000
      - name: limit
        in: query
        description: Number of locations returned in the response (doesn't apply when aggregation is enabled)
        schema:
          type: number
          maximum: 300
          default: 300
      - name: aggregate
        in: query
        description: If true, the results will be aggregated. For large radius it makes the response much faster.
        required: false
        schema:
          type: boolean
          default: false
      - name: aggregationPrecision
        in: query
        description: Value between 2 and 9. The bigger value is, the smaller is the cell size of the grid for aggregation. If not passed, a default value, based on radius, is assumed.
        required: false
        schema:
          type: number
          minimum: 2
          maximum: 9
      - name: language
        schema:
          type: string
          minLength: 2
          maxLength: 2
        in: query
        required: false
        example: en
        description: 'Supported languages: en, bg, cy, de, es, fi, fr, hu, is, it, lt, nb, nl, pl, pt, ro, sv.'
      responses:
        '200':
          description: OK
          content:
