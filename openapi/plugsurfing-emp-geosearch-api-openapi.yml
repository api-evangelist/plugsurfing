  /emp/v1/geosearch/route:
    post:
      summary: Search for locations along a route
      description: Search for locations along a route. The max number of points in a route is 300.
      operationId: searchEmpLocationsByRoute
      tags:
      - EMP Geosearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlongRouteRequest'
            example:
              points:
              - latitude: 52.52
                longitude: 13.405
              - latitude: 52.37
                longitude: 4.9
              filters:
                connectorStandards:
                - Combo
      parameters:
      - name: width
        in: query
        description: Width of the searching path in meters. 0.5 of the width on each side.
        schema:
          type: number
          default: 3000
      - name: limit
        in: query
        description: Number of locations returned in the response (doesn't apply when aggregation is enabled)
        schema:
          type: number
          maximum: 300
          default: 300
      - name: aggregate
        in: query
        description: If true, the results will be aggregated. For large radius it makes the response much faster.
        required: false
        schema:
          type: boolean
          default: false
      - name: aggregationPrecision
        in: query
        description: 'Value between 2 and 9. The bigger value is, the smaller is the cell size of the grid for aggregation. If not passed, a default value, based on radius, is assumed. Grid sizes: 2=1252.3km x 624.1km, 3=156.5km x 156km, 4=39.1km x 19.5km, 5=4.9km x 4.9km, 6=1.2km x 609.4m, 7=152.9m x 152.4m, 8=38.2m x 19m, 9=4.8m x 4.8m'
        required: false
        schema:
          type: number
          minimum: 2
          maximum: 9
      - name: fleetId
        in: query
        description: Optional - the id of the fleet organization, will be used to look up locations available for this fleet. If fleet id is not provided, the locations available to the EMP will be provided
        required: false
        schema:
          type: string
      - name: language
        schema:
          type: string
          minLength: 2
          maxLength: 2
        in: query
        required: false
        example: en
        description: 'Supported languages: en, bg, cy, de, es, fi, fr, hu, is, it, lt, nb, nl, pl, pt, ro, sv.'
