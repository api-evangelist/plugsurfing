openapi: 3.2.0
info:
  title: Drive EMP Geosearch API
  version: 1.0.0
  description: The Drive API provides comprehensive access to Plugsurfing's charging infrastructure network. It enables you to manage users, charging keys, search for charging locations, handle payments, and control charging sessions.
servers:
- url: https://{environment}.plugsurfing.com
  variables:
    environment:
      enum:
      - drive-api-stage
      default: drive-api-stage
      description: API environment - use drive-api-stage for testing and drive-api for production
tags:
- name: EMP Geosearch
  description: E-Mobility Provider specific endpoints for location search and information
paths:
  /emp/v1/geosearch/radius:
    post:
      summary: Search locations around a point
      description: Search for charging locations within a specified radius around a geographic point. The center point is passed via the `latitude` and `longitude` query parameters; the request body contains only filters. Returns up to 300 locations sorted by proximity to the search center (nearest first).
      operationId: searchEmpLocationsByRadius
      tags:
      - EMP Geosearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadiusRequest'
            example:
              filters:
                connectorStandards:
                - Type2
                capabilities:
                - REMOTE_START_STOP_CAPABLE
      parameters:
      - name: latitude
        in: query
        required: true
        example: '52.331142'
        schema:
          type: string
      - name: longitude
        in: query
        required: true
        example: '13.145221'
        schema:
          type: string
      - name: distance
        in: query
        description: Distance in m
        schema:
          type: number
          default: 30000
      - name: limit
        in: query
        description: Number of locations returned in the response (doesn't apply when aggregation is enabled)
        schema:
          type: number
          maximum: 300
          default: 300
      - name: aggregate
        in: query
        description: If true, the results will be aggregated. For large radius it makes the response much faster.
        required: false
        schema:
          type: boolean
          default: false
      - name: aggregationPrecision
        in: query
        description: Value between 2 and 9. The bigger value is, the smaller is the cell size of the grid for aggregation. If not passed, a default value, based on radius, is assumed.
        required: false
        schema:
          type: integer
          minimum: 2
          maximum: 9
      - name: fleetId
        in: query
        description: Optional - the id of the fleet organization, will be used to look up locations available for this fleet. If fleet id is not provided, the locations available to the EMP will be provided
        required: false
        schema:
          type: string
      - name: language
        schema:
          type: string
          minLength: 2
          maxLength: 2
        in: query
        required: false
        example: en
        description: 'Supported languages: en, bg, cy, de, es, fi, fr, hu, is, it, lt, nb, nl, pl, pt, ro, sv.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseListLocation'
              example:
                locations:
                - id: 8rMCionje8s2LtheVGEK90mYnJdJe5OZd48ecF/w1StRJSodFFzfQ3GhJbYbxG0gQhJv/Yjp5FXBJt14SccU9zFRdnC4SV7juPdCRaWkEZo=
                  name: Ebee Smart Technologies
                  coordinates:
                    latitude: '52.475911'
                    longitude: '13.350794'
                  evses:
                  - uid: 8rMCionje8s2LtheVGEK90mYnJdJe5OZd48ecF/w1StRJSodFFzfQ3GhJbYbxG0g3wFt7gLfnV3ulxmnoAzR4W/DFEMs63CndZpPK6L2aJG9qMC0Dp9OqeegGRXmiTOE
                    evse_id: +49*839*030*000074
                    physical_reference: '4'
                    status: AVAILABLE
                    connectors:
                    - {}
                    capabilities:
                    - RESERVABLE
                    - PLUG_AND_CHARGE_CAPABLE
                    - PLUG_AND_CHARGE_CAPABLE
                    last_updated: '2025-01-15T10:30:00Z'
                  operator:
                    id: '881941'
                    name: Ebee Smart Technologies
                    hotline: '+498944255071'
                    external_id: DE*ABC
                  operator_display_name: Sub-operator X
                  opening_times:
                    twentyfourseven: false
                    regular_hours:
                    - weekday: 1
                      period_begin: 00:10
                      period_end: '29:59'
                    exceptional_openings:
                    - period_begin: '2025-01-15T10:30:00Z'
                      period_end: '2025-01-15T10:30:00Z'
                    exceptional_closings:
                    - period_begin: '2025-01-15T10:30:00Z'
                      period_end: '2025-01-15T10:30:00Z'
                  directions:
                  - language: DE
                    text: example
                  country: DEU
                  state: Bayern
                  city: Berlin
                  postal_code: 10829
                  address: EUREF CAMPUS 4-5
                  openNow: false
                  is_green_energy: false
                  last_updated: '2024-03-15T14:30:00Z'
                aggregates:
                - coordinates:
                    latitude: '52.475911'
                    longitude: '13.350794'
                  count: 1
        '400':
          description: The provided query parameters, route parameters or body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorResponse'
              example:
                message: Invalid request payload
                details:
                - field X is required
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Resource not found
      security:
      - ApiKeyAuth: []
  /emp/v1/geosearch/rectangle:
    post:
      summary: Search locations within a rectangle
      description: Search for charging locations within a specified rectangle defined by two diagonal points. The rectangle coordinates are passed via the `topLatitude`, `bottomLatitude`, `leftLongitude`, and `rightLongitude` query parameters; the request body contains only filters. Returns up to 300 locations.
      operationId: searchEmpLocationsByRectangle
      tags:
      - EMP Geosearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RectangleRequest'
            example:
              filters:
                connectorStandards:
                - Combo
                capabilities:
                - CHARGING_PROFILE_CAPABLE
      parameters:
      - name: topLatitude
        in: query
        required: true
        description: Latitude of the top edge of the rectangle in decimal degrees (e.g. N58°30' is represented as 58.5). Must be greater than bottomLatitude.
        example: 52.354551
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: bottomLatitude
        in: query
        required: true
        description: Latitude of the bottom edge of the rectangle in decimal degrees (e.g. S58°30' is represented as -58.5)
        example: 52.354551
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: leftLongitude
        in: query
        required: true
        description: Longitude of the left edge of the rectangle in decimal degrees (e.g. E014°45' is represented as 14.75). Must be less than rightLongitude.
        example: 4.7391593
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: rightLongitude
        in: query
        required: true
        description: Longitude of the right edge of the rectangle in decimal degrees (e.g. E014°45' is represented as 14.75)
        example: 4.7391593
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: limit
        in: query
        description: Number of locations returned in the response (doesn't apply when aggregation is enabled)
        schema:
          type: number
          maximum: 300
          default: 300
      - name: aggregate
        in: query
        description: If true, the results will be aggregated. For large radius it makes the response much faster.
        required: false
        schema:
          type: boolean
          default: false
      - name: aggregationPrecision
        in: query
        description: Value between 2 and 9. The bigger value is, the smaller is the cell size of the grid for aggregation. If not passed, a default value, based on radius, is assumed.
        required: false
        schema:
          type: integer
          minimum: 2
          maximum: 9
      - name: fleetId
        in: query
        description: Optional - the id of the fleet organization, will be used to look up locations available for this fleet. If fleet id is not provided, the locations available to the EMP will be provided
        required: false
        schema:
          type: string
      - name: language
        schema:
          type: string
          minLength: 2
          maxLength: 2
        in: query
        required: false
        example: en
        description: 'Supported languages: en, bg, cy, de, es, fi, fr, hu, is, it, lt, nb, nl, pl, pt, ro, sv.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseListLocation'
              example:
                locations:
                - id: 8rMCionje8s2LtheVGEK90mYnJdJe5OZd48ecF/w1StRJSodFFzfQ3GhJbYbxG0gQhJv/Yjp5FXBJt14SccU9zFRdnC4SV7juPdCRaWkEZo=
                  name: Ebee Smart Technologies
                  coordinates:
                    latitude: '52.475911'
                    longitude: '13.350794'
                  evses:
                  - uid: 8rMCionje8s2LtheVGEK90mYnJdJe5OZd48ecF/w1StRJSodFFzfQ3GhJbYbxG0g3wFt7gLfnV3ulxmnoAzR4W/DFEMs63CndZpPK6L2aJG9qMC0Dp9OqeegGRXmiTOE
