  /emp/v1/locations/{locationId}/live-data:
    get:
      tags:
      - EMP Geosearch
      summary: Get location live data
      operationId: getEmpLocationLiveData
      description: Returns live charging data for the EVSEs of a location that are in use, including since when each EVSE has had its current live status. The `charge_point_statuses` keys match the EVSE `uid` values returned by Get location by id. EVSEs without live data are omitted. Returns `404` when the location is not found or live data is not enabled for your organization. For details, check https://developer.plugsurfing.com/docs/geosearch#location-live-data
      parameters:
      - name: locationId
        in: path
        description: Location id.
        required: true
        schema:
          type: string
      - name: fleetId
        in: query
        description: Optional - the id of the fleet organization, will be used for fleet-specific location context. If fleet id is not provided, the EMP location context will be used
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Live data of the location EVSEs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationLiveData'
              example:
                charge_point_statuses:
                  ee006b89511e81534e019ca0d9a780b351e9:
                    status: CHARGING
                    status_since: '2025-01-15T08:12:00Z'
        '404':
          description: Location not found or live data not enabled for your organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Resource not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Internal server error
      security:
      - ApiKeyAuth: []
