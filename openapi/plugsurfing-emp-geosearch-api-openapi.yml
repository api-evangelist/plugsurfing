  /emp/v1/locations/{locationId}:
    get:
      tags:
      - EMP Geosearch
      summary: Get location by id
      description: Returns detailed location data for a single charging location, with optional pricing context. Only one of keyIdentifier or fleetId can be provided in a single request. If none are provided, default prices are returned.
      operationId: getEmpLocationById
      parameters:
      - name: locationId
        in: path
        description: Location id.
        required: true
        schema:
          type: string
      - name: keyIdentifier
        in: query
        description: The keyIdentifier of a charging key, will be used to look up specific prices for this charging key.
        required: false
        schema:
          type: string
      - name: fleetId
        in: query
        description: Optional - the id of the fleet organization, will be used for fleet-specific location context. If fleet id is not provided, the EMP location context will be used
        required: false
        schema:
          type: string
      - name: language
        in: query
        description: 'Supported languages: en, bg, cy, de, es, fi, fr, hu, is, it, lt, nb, nl, pl, pt, ro, sv.'
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 2
        example: en
      responses:
        '200':
          description: Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
              example:
                id: 8rMCionje8s2LtheVGEK90mYnJdJe5OZd48ecF/w1StRJSodFFzfQ3GhJbYbxG0gQhJv/Yjp5FXBJt14SccU9zFRdnC4SV7juPdCRaWkEZo=
