aid: plugsurfing
name: Plugsurfing
description: Plugsurfing provides a seamless EV charging experience across Europe, offering drivers access to a large network of charging stations
  through its mobile app and white‑label solutions for businesses. The platform supports roaming via the OCPI 2.2.1 protocol, enabling operators
  to connect to the Plugsurfing network with real‑time charger data, tariffs, and availability. It also offers APIs for developers to embed charging
  functionality into apps, in‑car navigation, and other digital services, fostering a more integrated electric mobility ecosystem.
